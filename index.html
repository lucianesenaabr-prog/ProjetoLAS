<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Link Suspeito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap">
<style>
/* Layout: one terminal window centered on a dark screen. Log lines type in, then the photo drops from the top, then the contact button appears. */
:root {
  --bg: #090d0a;
  --panel: #0f1511;
  --line: #22322712;
  --edge: #223227;
  --fg: #cdeed6;
  --dim: #6b8872;
  --warn: #ffb347;
  --danger: #ff6b5e;
  --ok: #6dffa8;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --display: 'VT323', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background-image: repeating-linear-gradient(0deg, rgba(109,255,168,0.035) 0 1px, transparent 1px 3px);
}
.win {
  width: 100%;
  max-width: 640px;
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 6px;
  overflow: hidden;
}
.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--edge);
  color: var(--dim);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.bar .flag { color: var(--danger); }
.screen { padding: 22px 20px 26px; min-width: 0; }
#log { min-height: 15.5rem; }
.line { margin: 0 0 10px; overflow-wrap: anywhere; }
.line.dim { color: var(--dim); }
.line.warn { color: var(--warn); font-family: var(--display); font-size: clamp(30px, 7vw, 40px); line-height: 1.05; letter-spacing: 0.01em; }
.line.danger { color: var(--danger); font-weight: 600; }
.line.ok { color: var(--ok); }
.cursor {
  display: inline-block;
  width: 0.6em;
  height: 1.05em;
  background: var(--ok);
  vertical-align: text-bottom;
  margin-left: 2px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.reveal { margin-top: 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-width: 0; }
.avatar-slot { height: 148px; display: flex; align-items: flex-end; justify-content: center; }
.avatar {
  width: 132px;
  height: 132px;
  border-radius: 50%;
  border: 3px solid var(--ok);
  background: #14201a;
  color: var(--ok);
  display: grid;
  place-items: center;
  font-family: var(--display);
  font-size: 64px;
  overflow: hidden;
  visibility: hidden;
  box-shadow: 0 0 0 6px rgba(109,255,168,0.08);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.drop { visibility: visible; animation: fall 1.1s cubic-bezier(.3,.1,.3,1) both; }
@keyframes fall {
  0% { transform: translateY(-420px); }
  45% { transform: translateY(0); }
  62% { transform: translateY(-46px); }
  78% { transform: translateY(0); }
  88% { transform: translateY(-14px); }
  100% { transform: translateY(0); }
}
.name { font-family: var(--display); font-size: 40px; line-height: 1; margin: 10px 0 0; color: var(--fg); }
.role { color: var(--dim); margin: 0; font-size: 13px; max-width: 46ch; }
.fade { opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s ease; }
.fade.in { opacity: 1; transform: none; }
.cta {
  display: inline-block;
  margin-top: 14px;
  padding: 13px 26px;
  background: var(--ok);
  color: #06140c;
  font-family: var(--mono);
  font-weight: 600;
  font-size: 15px;
  text-decoration: none;
  border-radius: 4px;
  border: 0;
  cursor: pointer;
}
.cta:hover { filter: brightness(1.08); }
.cta:focus-visible, .ghost:focus-visible { outline: 2px solid var(--warn); outline-offset: 3px; }
.mail {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--dim);
}
.mail span.addr { color: var(--fg); user-select: all; overflow-wrap: anywhere; }
.ghost {
  background: transparent;
  color: var(--dim);
  border: 1px solid var(--edge);
  border-radius: 4px;
  padding: 4px 10px;
  font-family: var(--mono);
  font-size: 12px;
  cursor: pointer;
}
.ghost:hover { color: var(--fg); border-color: var(--dim); }
.foot { margin-top: 14px; font-size: 12px; color: var(--dim); }
.tools { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; min-height: 30px; }
.shake { animation: shake .45s linear; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}
@media (prefers-reduced-motion: reduce) {
  .avatar.drop { animation: none; }
  .fade { transition: none; }
  .shake { animation: none; }
  .cursor { animation: none; }
}
</style>

</head>
<body>
<main class="win" id="win">
  <div class="bar"><span>link_suspeito.log</span><span class="flag">● erro</span></div>
  <div class="screen">
    <div id="log" aria-live="polite"></div>

    <section class="reveal" id="reveal" aria-label="Contato">
      <div class="avatar-slot"><div class="avatar" id="avatar" aria-hidden="false"></div></div>
      <p class="name fade" id="name">Luciane Sena</p>
      <p class="role fade" id="role">Analista de Compliance | Controles Internos &amp; GRC | KYC/KYP e Due Diligence | LGPD | Gestão de Riscos</p>
      <a class="cta fade" id="cta" href="https://www.linkedin.com/in/luciane-sena-61a923134" target="_blank" rel="noopener">Faça contato agora</a>
      <div class="mail fade" id="mail">
        <span>ou escreva para</span>
        <span class="addr" id="addr">luciane.sena.abr@gmail.com</span>
        <button class="ghost" id="copy" type="button">copiar</button>
      </div>
      <p class="foot fade" id="foot">(foi só uma brincadeira. O currículo é de verdade.)</p>
    </section>

    <div class="tools">
      <button class="ghost" id="skip" type="button">pular animação</button>
      <button class="ghost" id="replay" type="button" hidden>ver o erro de novo</button>
    </div>
  </div>
</main>

  var log = document.getElementById("log");
  var avatar = document.getElementById("avatar");
  var fades = ["name", "role", "cta", "mail", "foot"].map(function (id) { return document.getElementById(id); });
  var skipBtn = document.getElementById("skip");
  var replayBtn = document.getElementById("replay");
  var win = document.getElementById("win");
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var skipped = false;
  var runId = 0;

  if (PHOTO) {
    var img = document.createElement("img");
    img.src = PHOTO;
    img.alt = "Foto de Luciane Sena";
    avatar.appendChild(img);
  } else {
    avatar.textContent = "LS";
  }

  var script = [
    { cls: "dim", text: "$ abrindo link...", speed: 30, pause: 500 },
    { cls: "warn", text: "ei, você acaba de cair em um link suspeito.", speed: 38, pause: 700, shake: true },
    { cls: "dim", text: "[!] escaneando a sua empresa...", speed: 30, dots: true, pause: 300 },
    { cls: "danger", text: "ERRO 404: analista de compliance não encontrada.", speed: 22, pause: 700, shake: true },
    { cls: "ok", text: "solução detectada: contratar uma. Depois disso, esse erro não aparece mais.", speed: 20, pause: 600 },
    { cls: "ok", text: "carregando profissional...", speed: 28, pause: 500 }
  ];

  function wait(ms, id) {
    return new Promise(function (resolve) {
      if (skipped || reduced) return resolve();
      setTimeout(resolve, ms);
    });
  }

  function typeInto(el, text, speed) {
    return new Promise(function (resolve) {
      var i = 0;
      (function step() {
        if (skipped || reduced) { el.textContent = text; return resolve(); }
        el.textContent = text.slice(0, ++i);
        if (i >= text.length) return resolve();
        setTimeout(step, speed);
      })();
    });
  }

  function showAll() {
    avatar.classList.add("drop");
    fades.forEach(function (el) { el.classList.add("in"); });
  }

  function reset() {
    log.innerHTML = "";
    avatar.classList.remove("drop");
    fades.forEach(function (el) { el.classList.remove("in"); });
    replayBtn.hidden = true;
    skipBtn.hidden = false;
    skipped = false;
  }

  function makeLine(item) {
    var p = document.createElement("p");
    p.className = "line " + item.cls;
    var span = document.createElement("span");
    var cur = document.createElement("span");
    cur.className = "cursor";
    p.appendChild(span);
    p.appendChild(cur);
    log.appendChild(p);
    return { p: p, span: span, cur: cur };
  }

  async function run() {
    var my = ++runId;
    reset();
    for (var k = 0; k < script.length; k++) {
      if (my !== runId) return;
      var item = script[k];
      var l = makeLine(item);
      await typeInto(l.span, item.text, item.speed);
      if (item.dots) {
        for (var d = 0; d < 3; d++) {
          await wait(260);
          l.span.textContent += ".";
        }
      }
      if (item.shake && !reduced && !skipped) {
        win.classList.remove("shake");
        void win.offsetWidth;
        win.classList.add("shake");
      }
      l.cur.remove();
      await wait(item.pause);
    }
    if (my !== runId) return;
    avatar.classList.add("drop");
    await wait(1100);
    for (var f = 0; f < fades.length; f++) {
      fades[f].classList.add("in");
      await wait(220);
    }
    skipBtn.hidden = true;
    replayBtn.hidden = false;
  }

  skipBtn.addEventListener("click", function () {
    skipped = true;
    showAll();
    skipBtn.hidden = true;
    replayBtn.hidden = false;
  });
  replayBtn.addEventListener("click", function () { run(); });

  var copyBtn = document.getElementById("copy");
  copyBtn.addEventListener("click", function () {
    var addr = document.getElementById("addr");
    var text = addr.textContent;
    function selectFallback() {
      try {
        var r = document.createRange();
        r.selectNodeContents(addr);
        var s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
      } catch (e) {}
      copyBtn.textContent = "selecionado";
    }
    try {
      navigator.clipboard.writeText(text).then(function () {
        copyBtn.textContent = "copiado";
        setTimeout(function () { copyBtn.textContent = "copiar"; }, 1800);
      }, selectFallback);
    } catch (e) { selectFallback(); }
  });

  run();
})();
</script>
